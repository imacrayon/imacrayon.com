  <style>.cantilever {
  position: relative;
  display: block;
  padding-block: 2rem;
}

.cantilever::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 2rem;
  background: var(--black);
}

.cantilever>div {
  position: relative;
}

.cantilever>div::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 50%;
  height: 50%;
  background: var(--black);
  z-index: -1;
}

.cantilever>div::after {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 50%;
  height: 100%;
  background: var(--primary);
  z-index: -1;
  border-block-start: 2px solid var(--black);
  border-block-end: 2px solid var(--black);
}

.cantilever .center>* {
  position: relative;
  background: var(--primary);
  color: var(--black);
  padding: 2rem;
  border-block-start: 2px solid var(--black);
  border-block-end: 2px solid var(--black);
  border-inline-start: 2px solid var(--black);
}

@media screen and (min-width: 920px) {
  .cantilever .center>* {
    margin-inline-start: -2rem;
  }
}

.cantilever h1,
.cantilever h2 {
  color: var(--primary);
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  padding-block: .25rem;
  border-block-end: 1px solid var(--black);
  position: absolute;
  bottom: 100%;
  left: 0;
}
.pagination {
  display: block;
  position: relative;
  border-block: 2px solid var(--black);
}
.pagination:before {
  content: '';
  height: 100%;
  width: 2px;
  background: var(--black);
  position: absolute;
  left: 50%;
  top: 0;
  transform: translateX(-50%);
}
.pagination ul {
  margin: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 2rem;
}
.pagination li {
  position: relative;
}
.pagination li:last-child {
  text-align: right;
}
.pagination li:focus-within {
  outline: 2px solid var(--black);
  outline-offset: .5rem;
}
.pagination span:first-child {
  font-size: var(--text-sm);
  font-family: var(--font-mono);
  display: block;
  margin-block-end: .875em;
  text-decoration: underline;
}
.pagination strong {
  display: block;
  text-wrap: balance;
  font-weight: 700;
}
.pagination a {
  padding: 0;
  font-size: 1rem;
  line-height: 1.13;
  text-decoration: none;
}
.pagination a::before {
  content: '';
  position: absolute;
  inset: .5rem;
}
.pagination a:focus,
.pagination a:hover {
  outline: none;
  text-decoration: underline;
  text-decoration-thickness: 1px;
}
.cantilever dl {
  font-size: .875em;
}

.cantilever dt {
  display: block;
  font-weight: 700;
}

.cantilever dd {
  display: block;
  margin-top: .25em;
